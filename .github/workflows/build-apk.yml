name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libssl-dev \
            cmake libffi-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          pip install virtualenv

      - name: Pre-Install and Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Accept licenses on the runner's pre-installed SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Force install build-tools and platforms matching target requirements
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;33.0.1" "platforms;android-33"

      - name: Build APK
        env:
          # Bind to pre-licensed runner SDK paths directly
          ANDROID_SDK_PATH: /usr/local/lib/android/sdk
          ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk-bundle
        run: |
          cd nova_mobile
          # Force buildozer to use pre-licensed paths and explicitly override prompt defaults
          buildozer android debug --sdk_path=$ANDROID_SDK_PATH --ndk_path=$ANDROID_NDK_PATH --auto-accept-licenses

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Mobile-Link-APK
          path: nova_mobile/bin/*.apk