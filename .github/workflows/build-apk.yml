name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cloud Repository Branch
        uses: actions/checkout@v4

      - name: Set up System JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Compilation Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev

      - name: Set up Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer Tooling Core
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer virtualenv

      - name: Pre-Install and Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Accept licenses on the runner's pre-installed SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Force install build-tools 33.0.1 (the stable target API matching Buildozer's default Android API 33 setup)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;33.0.1" "platforms;android-33"

      - name: Execute Buildozer APK Production Compile
        env:
          # Tell buildozer to bypass its own download loop and use the pre-licensed system SDK
          ANDROID_SDK_PATH: /usr/local/lib/android/sdk
          ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk-bundle
        run: |
          cd nova_mobile
          # 🌟 FIX: Force buildozer to read the environment paths and auto-accept license terms explicitly
          buildozer android debug --sdk_path=$ANDROID_SDK_PATH --ndk_path=$ANDROID_NDK_PATH --auto-accept-licenses

      - name: Export Distributable APK Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Mobile-Link-APK
          path: nova_mobile/bin/*.apk