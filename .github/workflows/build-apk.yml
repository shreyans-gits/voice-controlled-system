name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libssl-dev \
            cmake libffi-dev libltdl-dev

      - name: Install Buildozer and p4a
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36
          pip install buildozer==1.5.0
          pip install virtualenv
          # Pin to v2024.01.21: last release before Python 3.14, has AAB support
          pip install git+https://github.com/kivy/python-for-android.git@v2024.01.21

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;33.0.1" \
            "platforms;android-33"

      - name: Clean Buildozer Cache
        run: |
          rm -rf ~/.buildozer
          rm -rf nova_mobile/.buildozer

      - name: Build APK
        run: |
          cd nova_mobile
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Mobile-Link-APK
          path: nova_mobile/bin/*.apk